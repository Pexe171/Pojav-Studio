name: Verify Studio
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://studio:studio@localhost:5432/studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Test concurrent launcher directories
        run: |
          mkdir -p "$RUNNER_TEMP/studio-directory-test"
          javac -d "$RUNNER_TEMP/studio-directory-test" integrations/amethyst/overlay/src/main/java/net/kdt/pojavlaunch/studio/StudioFiles.java tests/StudioFilesTest.java
          java -cp "$RUNNER_TEMP/studio-directory-test" net.kdt.pojavlaunch.studio.StudioFilesTest
      - name: Test launcher performance profiles
        run: |
          mkdir -p "$RUNNER_TEMP/studio-performance-test"
          javac -d "$RUNNER_TEMP/studio-performance-test" integrations/amethyst/overlay/src/main/java/net/kdt/pojavlaunch/studio/StudioPerformance.java tests/StudioPerformanceTest.java
          java -cp "$RUNNER_TEMP/studio-performance-test" net.kdt.pojavlaunch.studio.StudioPerformanceTest
